[package]
name = "usclaude"
version = "0.2.0"
edition = "2024"
rust-version = "1.89"
description = "Icône de zone de notification affichant les limites d'usage de Claude Code (/usage)"
license = "MIT"
repository = "https://github.com/niqoz/usclaude"
readme = "README.md"
keywords = ["claude", "tray", "systray", "usage", "linux"]
categories = ["command-line-utilities"]

[dependencies]
chrono = "0.4.45"
ksni = { version = "0.3.6", default-features = false, features = ["blocking", "async-io"] }
serde_json = "1"
ureq = "3.4.1"

[profile.release]
strip = true
